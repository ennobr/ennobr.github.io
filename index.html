<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Personal research website of Enno Breukelman, doctoral student at KTH."
    />
    <title>Enno Breukelman</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;650;750&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=20260611c" />
    <script src="scripts/site-content.js?v=20260611c" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <nav class="topbar" aria-label="Primary navigation">
        <a class="brand" href="/">Enno Breukelman</a>
        <div class="nav-links">
          <a href="#about">About</a>
          <a href="#news">News</a>
          <a href="#projects">Projects</a>
          <a href="#publications">Publications</a>
          <a href="#contact">Contact</a>
        </div>
      </nav>

      <section id="about" class="hero" aria-labelledby="intro-title">
        <div class="hero-copy">
          <p id="profile-role" class="role"></p>
          <h1 id="profile-name">Enno Breukelman</h1>
          <div id="profile-bio" class="bio"></div>
          <div
            id="profile-links"
            class="hero-actions"
            aria-label="Profile links"
          ></div>
        </div>
        <figure class="portrait-card">
          <img
            id="profile-portrait"
            src="assets/images/profile-placeholder.svg"
            alt="Portrait of Enno Breukelman"
          />
          <figcaption id="profile-caption"></figcaption>
        </figure>
      </section>

      <section id="news" class="section split-section">
        <div>
          <p class="section-kicker">News</p>
          <h2>Recent updates</h2>
        </div>
        <ol id="news-list" class="news-list"></ol>
      </section>

      <section id="projects" class="section split-section">
        <div>
          <p class="section-kicker">Projects</p>
          <h2>Current work</h2>
        </div>
        <div id="project-list" class="card-grid"></div>
      </section>

      <section id="publications" class="section publications">
        <div class="section-heading">
          <div>
            <p class="section-kicker">Publications</p>
            <h2>Selected publications</h2>
          </div>
          <a
            class="text-link"
            href="https://scholar.google.com/citations?hl=en&amp;user=byz1x3cAAAAJ"
            rel="noreferrer"
          >
            View all on Google Scholar
          </a>
        </div>
        <div id="publication-list" class="publication-list" aria-live="polite"></div>
      </section>

      <section id="contact" class="section contact-band">
        <div>
          <p class="section-kicker">Contact</p>
          <h2>Get in touch</h2>
          <div class="sport-icons" aria-label="Cycling, swimming, and running">
            <span class="sport-icon bike" role="img" aria-label="Cycling"></span>
            <span class="sport-icon swim" role="img" aria-label="Swimming"></span>
            <span class="sport-icon run" role="img" aria-label="Running"></span>
          </div>
        </div>
        <div id="contact-links" class="contact-links"></div>
      </section>
    </main>
  </body>
</html>
